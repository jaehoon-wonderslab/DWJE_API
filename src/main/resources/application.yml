# =====================================================================================
#  덕우전자 AX 시스템 API — 공통 설정
#  프로파일 : local / dev / prod — **기본값 없음. 반드시 지정해야 한다**
#  실행     : ./gradlew bootRun --args='--spring.profiles.active=local'
# =====================================================================================
spring:
  application:
    name: dwje-api
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    connection-timeout: 20000
    threads:
      max: 200
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
    min-response-size: 2048

# --- 업무 공통 설정 -------------------------------------------------------------------
app:
  # MESDB_M 분리 후 실적 데이터는 전건 PL01 (모바일 사업부)
  default-plant-cd: PL01
  # 로그인 연속 실패 잠금 임계값
  login-fail-limit: 5
  # 데이터 접근 권한 기반 응답 마스킹 사용 여부
  masking-enabled: true
  # 보고서 다운로드 이력 보존 연수
  download-retention-years: 3
  # 프레스 작업장 코드 — 일일 생산현황 보고에서 공정 미지정 시 이 범위만 집계한다.
  # tb_md_workcenter 에 공정 구분 컬럼이 없어 코드로 못 박는다. (W110/W150/W120 = A/B/C-프레스)
  press-workcenters:
    - W110
    - W150
    - W120
  # sLLM 서빙 — 서빙은 HTTP 다(Ollama · vLLM · llama.cpp 모두 HTTP 서버).
  # HTTP 클라이언트는 JDK 21 표준 java.net.http.HttpClient 를 쓴다(의존성 없음).
  ai:
    # 끄면 두 AI 엔드포인트가 MODEL_NOT_READY 를 낸다.
    enabled: true
    base-url: http://localhost:11434
    # 덕우전자용 튜닝본
    model: gemma4:e4b-dwje
    # 저장된 청크 임베딩이 1024차원이라 같은 차원을 내는 모델이어야 한다
    embed-model: bge-m3:latest
    # 이 모델은 추론(thinking)에 토큰을 먼저 쓴다. 300 이면 본문이 빈 문자열로 온다.
    # 원인 분석은 문서 인용문이 붙어 브리핑보다 훨씬 길다 — 1200 에서 done_reason=length 로 잘렸다.
    num-predict: 3500
    # 실측 2~3문장에 약 28초. 화면 쪽 제한이 300초이므로 그보다 짧게 둔다.
    timeout-sec: 240
    # 로컬 서빙은 한 번에 하나씩 처리한다. 앞선 호출을 이만큼 기다려도 차례가
    # 오지 않으면 시작하지 않고 포기한다. GPU 서버로 옮겨 동시 처리가 되면 줄여도 된다.
    queue-wait-sec: 200
    # 문서 경로에서 이 접두 이후만 상대경로로 내려보낸다.
    # source_path 에는 적재한 PC 의 마운트 지점이 들어 있어 다른 PC 에서는 열 수 없다.
    doc-root-marker: /FACA/
    # 원인 분석 대상 불량률 기준(%) — 이 값을 넘는 공정만 분석한다.
    cause-threshold: 3.5
    # 한 번에 분석할 최대 공정 수. 넘치면 불량률 높은 순으로 자르고 몇 곳이 잘렸는지 알린다.
    cause-max-targets: 5
  # 이상 후보 설비의 최소 생산량 — 이 미만은 후보에서 뺀다.
  # 생산량이 적으면 불량 1건으로 불량률 100% 가 되어 최대 이슈로 올라온다.
  # 현업 확인 전 임시값이다.
  anomaly-min-qty: 1000
  # 업로드 리포트(AI 통합 대시보드) 원본 엑셀 저장소. 배포 환경은 AX_UPLOAD_DIR 로 바꾼다.
  upload:
    dir: "${AX_UPLOAD_DIR:./data/ax-uploads}"
    # 원본 1건 상한(바이트). 20MB. spring.servlet.multipart 상한(50MB)보다 작아야 한다.
    max-bytes: 20971520
  # AOI 치수 원천(MSSQL EDGE.dbo.TB_SAMSUN_DIMENSION) 직접 조회 — 적재 배치·집계 테이블은 만들지 않는다(현업 결정 13).
  # 계정은 환경변수로만 준다(AX_MSSQL_URL · AX_MSSQL_USER · AX_MSSQL_PASSWORD). 계정이 비면 SOURCE_NOT_CONFIGURED 를 낸다.
  aoi:
    mssql:
      enabled: true
      # sendStringParametersAsUnicode=false — varchar 키 열에 nvarchar 파라미터가 오면 PK 탐색이 스캔이 된다. URL 에 없으면 서버가 붙인다.
      url: "${AX_MSSQL_URL:jdbc:sqlserver://192.168.7.203:1433;databaseName=EDGE;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=false}"
      username: "${AX_MSSQL_USER:}"
      password: "${AX_MSSQL_PASSWORD:}"
      # 원천 동시 접속 상한 — 조회 하나가 설비 수만큼 쿼리를 내므로 이 수가 원천 부담의 상한이다.
      pool-size: 3
      parallelism: 3
      # 쿼리 하나의 제한 시간(초). 실측 하루치 설비 전체 43초(콜드).
      query-timeout-sec: 180
    # 조회 기간 상한(일) — 실측으로 정했다(docs/AOI_DIMENSION_API_20260913.md 2절). 화면은 이 값을 넘게 고를 수 없다.
    max-days: 7
    # AOI 외관 판정 원천(EDGE.dbo.TB_SAMSUN_COSMETIC) — 2026-09-14 발주자 지시로 AOI 는 이 표만 쓴다.
    # 치수(DIMENSION)와 설비가 겹치지 않는다: 외관 MN-*(S135 레이저·S138/W160 PACKING), 치수 GP-*·MQ-*(S110 도금·S120 도장).
    cosmetic:
      enabled: true
      # 기간 상한 3일 — 행수 3,022만으로 치수(696만)의 4.3배라 7일을 그대로 쓰면 쿼리 제한(180초)에 걸린다.
      # 실측 근거 docs/AOI_COSMETIC_SOURCE_SURVEY_20260914.md 8절.
      max-days: 3
      date-index: "SAMSUN_COSMETIC_DATE_TIME"
      # 검사 항목 코드 → 한글 이름. 원천에 이름이 없다(2026-09-14 발주자 확인) — 비면 화면이 코드를 그대로 쓴다.
      # 발주자가 이름을 주면 여기에 적는다. 예: { DF003: "치수 이상", DF021: "이물" }
      item-names: {}
      # 합부를 정하지 않는 항목 — 이 항목의 PASSED=0 은 불량이 아니라 「값 없음」이다.
      # DF009 실측(09-12 전수): DF009 만 불량인 제품 50,976개 중 최종 불량 0개(0.00%).
      # 다른 항목은 그 항목만 불량이면 100% 최종 불량이다. 귀속·설명률에서 빼되 목록에는 verdict:false 로 남긴다.
      non-verdict-items:
        - DF009
    # 조회 결과 보관(초). 지난 기간 30분, 오늘이 든 기간 10분 — 현업 요구 최신성 30분~1시간.
    cache-ttl-sec: 1800
    today-cache-ttl-sec: 600
    cache-max-entries: 200
    # 측정 실패 판정 — 사용 FAI 중 0 이 아닌 값이 이 개수 이하면 측정 실패.
    zero-row-nonzero-max: 5
    briefing-top-fai: 5
    # 확정 한계 세트 — PASSED 라벨 포화로 되찾은 값(docs/AOI_DIMENSION_SPEC_BACKCALC_20260913.md · S110_AND_DAILY_DESIGN).
    # 여러 날짜·설비 표본에서 분해능 단위까지 일치한 것만 적었다. 확정되지 않은 FAI 는 적지 않는다(한계 없음).
    limits:
      # S120 도장(MQ-*) — MQ-008 3일 · MQ-003 · MQ018 5표본 일치. 상한 9 · 하한 2. 설비 공통.
      - wc-cd: S120
        eqpt-cd: "*"
        resolution: 0.001
        fai-count: 58
        usl: { "1": 0.040, "2": 24.435, "4": 24.622, "5": 24.622, "7": 19.859, "10": 22.880, "11": 22.880, "32": 4.222, "52": 3.760 }
        lsl: { "51": 3.560, "52": 3.560 }
        basis: "MQ-008 2026-09-09~11 · MQ-003 · MQ018 09-11 (5표본 일치, 합격 오탐 0)"
      # S110 도금(GP-*) 기본 — GP-009 3일 동일값. GP-013·GP-014 도 같은 값(합격 오탐 0).
      - wc-cd: S110
        eqpt-cd: "*"
        resolution: 0.0001
        fai-count: 45
        usl: { "1": 0.070, "15": 20.169 }
        lsl: { "15": 20.069, "16": 20.069, "17": 20.069, "34": 0.258 }
        basis: "GP-009 2026-09-09~11 3일 일치 · GP-013·014 09-11 검증 (합격 오탐 0)"
      # S110 GP-015 — 다른 규격(다른 제품 추정). 09-11 하루 표본의 포화값이라 재확정 대상이다.
      - wc-cd: S110
        eqpt-cd: GP-015
        resolution: 0.0001
        fai-count: 45
        usl: { "1": 0.070, "15": 20.164 }
        lsl: { "15": 20.074, "16": 20.074, "17": 20.074, "34": 0.258 }
        basis: "GP-015 2026-09-11 단일 표본 포화값 — 7일 표본으로 재확정 필요"
  # 도금·코팅 작업장 — Plating·Coating 아침회의 자료의 기본 범위 (18개)
  plating-workcenters: [V110, V111, V112, V113,
                        S114, S115, S140, S116, S110, S117, S118, S112, S113,
                        S121, S122, S123, S120, S142]
  security:
    password:
      # 비밀번호 해시 알고리즘
      #   PBKDF2_SHA512 : PBKDF2-HMAC-SHA512 (기본). 솔트 + 반복 확장 (RFC 8018)
      #   SHA512        : 솔트 1회 SHA-512. 기존 시스템 해시와 값을 맞춰야 할 때만 사용
      algorithm: PBKDF2_SHA512
      # OWASP 2023 권고 반복 횟수. 낮추면 대입 공격에 약해지고, 높이면 로그인이 느려진다.
      iterations: 210000
      salt-bytes: 16
      # 비밀번호 정책
      min-length: 8
      require-mixed-types: true
    email-verification:
      # 발송 방식 — LOG(로컬: 코드를 로그로 출력) | SMTP(실제 메일 발송)
      sender-mode: LOG
      from-address: no-reply@dwje.co.kr
      code-length: 6
      expire-minutes: 5          # 인증 코드 유효 시간
      max-attempts: 5            # 코드 검증 시도 상한
      resend-wait-sec: 60        # 재발송 대기
      daily-send-limit: 10       # 이메일당 일일 발송 상한
      token-expire-minutes: 10   # 검증 후 발급되는 1회용 토큰 유효 시간
  jwt:
    issuer: dwje-api
    access-token-validity-sec: 3600      # 1시간
    refresh-token-validity-sec: 604800   # 7일

# --- API 문서 -------------------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    # 엔드포인트가 200건을 넘어 기본값(list)으로 두면 태그가 모두 펼쳐져 화면이 무거워진다.
    # none = 태그만 접힌 채 표시 → 필요한 도메인만 펼쳐 본다.
    doc-expansion: none
    # 엔드포인트 검색창. 이 규모에서 원하는 API 를 찾으려면 사실상 필수다.
    filter: true
    # Authorize 로 넣은 토큰을 새로고침 후에도 유지한다(localStorage).
    # 토큰을 매번 다시 붙여넣지 않아도 된다.
    persist-authorization: true
    # 'Try it out' 을 매번 누르지 않아도 되도록 기본 활성화한다.
    try-it-out-enabled: true
    # 응답 소요 시간을 함께 표시한다.
    display-request-duration: true
    # 스키마가 69종이라 하단 Schemas 섹션은 접어 둔다.
    default-models-expand-depth: -1
  api-docs:
    path: /v3/api-docs
  # 공통 응답 래퍼(ApiResponse)가 모든 API 에 동일하게 걸리므로 스키마를 한 번만 정의한다.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
