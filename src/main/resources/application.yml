# =====================================================================================
#  덕우전자 AX 시스템 API — 공통 설정
#  프로파일 : local / dev / prod — **기본값 없음. 반드시 지정해야 한다**
#  실행     : ./gradlew bootRun --args='--spring.profiles.active=local'
# =====================================================================================
spring:
  application:
    name: dwje-api
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    connection-timeout: 20000
    threads:
      max: 200
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
    min-response-size: 2048

# --- 업무 공통 설정 -------------------------------------------------------------------
app:
  # MESDB_M 분리 후 실적 데이터는 전건 PL01 (모바일 사업부)
  default-plant-cd: PL01
  # 로그인 연속 실패 잠금 임계값
  login-fail-limit: 5
  # 데이터 접근 권한 기반 응답 마스킹 사용 여부
  masking-enabled: true
  # 보고서 다운로드 이력 보존 연수
  download-retention-years: 3
  # 프레스 작업장 코드 — 일일 생산현황 보고에서 공정 미지정 시 이 범위만 집계한다.
  # tb_md_workcenter 에 공정 구분 컬럼이 없어 코드로 못 박는다. (W110/W150/W120 = A/B/C-프레스)
  press-workcenters:
    - W110
    - W150
    - W120
  # sLLM 서빙 — 서빙은 HTTP 다(Ollama · vLLM · llama.cpp 모두 HTTP 서버).
  # HTTP 클라이언트는 JDK 21 표준 java.net.http.HttpClient 를 쓴다(의존성 없음).
  ai:
    # 끄면 두 AI 엔드포인트가 MODEL_NOT_READY 를 낸다.
    enabled: true
    base-url: http://localhost:11434
    # 덕우전자용 튜닝본
    model: gemma4:e4b-dwje
    # 저장된 청크 임베딩이 1024차원이라 같은 차원을 내는 모델이어야 한다
    embed-model: bge-m3:latest
    # 이 모델은 추론(thinking)에 토큰을 먼저 쓴다. 300 이면 본문이 빈 문자열로 온다.
    # 원인 분석은 문서 인용문이 붙어 브리핑보다 훨씬 길다 — 1200 에서 done_reason=length 로 잘렸다.
    num-predict: 3500
    # 실측 2~3문장에 약 28초. 화면 쪽 제한이 300초이므로 그보다 짧게 둔다.
    timeout-sec: 240
    # 로컬 서빙은 한 번에 하나씩 처리한다. 앞선 호출을 이만큼 기다려도 차례가
    # 오지 않으면 시작하지 않고 포기한다. GPU 서버로 옮겨 동시 처리가 되면 줄여도 된다.
    queue-wait-sec: 200
    # 문서 경로에서 이 접두 이후만 상대경로로 내려보낸다.
    # source_path 에는 적재한 PC 의 마운트 지점이 들어 있어 다른 PC 에서는 열 수 없다.
    doc-root-marker: /FACA/
    # 원인 분석 대상 불량률 기준(%) — 이 값을 넘는 공정만 분석한다.
    cause-threshold: 3.5
    # 한 번에 분석할 최대 공정 수. 넘치면 불량률 높은 순으로 자르고 몇 곳이 잘렸는지 알린다.
    cause-max-targets: 5
  # 이상 후보 설비의 최소 생산량 — 이 미만은 후보에서 뺀다.
  # 생산량이 적으면 불량 1건으로 불량률 100% 가 되어 최대 이슈로 올라온다.
  # 현업 확인 전 임시값이다.
  anomaly-min-qty: 1000
  # 업로드 리포트(AI 통합 대시보드) 원본 엑셀 저장소. 배포 환경은 AX_UPLOAD_DIR 로 바꾼다.
  upload:
    dir: "${AX_UPLOAD_DIR:./data/ax-uploads}"
    # 원본 1건 상한(바이트). 20MB. spring.servlet.multipart 상한(50MB)보다 작아야 한다.
    max-bytes: 20971520
  # AOI 불량 이미지가 있는 NAS 마운트 루트. 이 아래 경로만 프록시로 내려준다.
  # NAS 경로 규칙 문서(발주자 제공 예정)가 오기 전 임시값이다.
  nas:
    aoi-root: "${AX_NAS_AOI_ROOT:./data/nas-aoi}"
    # 이미지 프록시 URL 서명의 유효시간(초). 상세 응답을 받은 뒤 이 시간 안에 그려야 한다.
    image-url-ttl-sec: 900
  # 도금·코팅 작업장 — Plating·Coating 아침회의 자료의 기본 범위 (18개)
  plating-workcenters: [V110, V111, V112, V113,
                        S114, S115, S140, S116, S110, S117, S118, S112, S113,
                        S121, S122, S123, S120, S142]
  security:
    password:
      # 비밀번호 해시 알고리즘
      #   PBKDF2_SHA512 : PBKDF2-HMAC-SHA512 (기본). 솔트 + 반복 확장 (RFC 8018)
      #   SHA512        : 솔트 1회 SHA-512. 기존 시스템 해시와 값을 맞춰야 할 때만 사용
      algorithm: PBKDF2_SHA512
      # OWASP 2023 권고 반복 횟수. 낮추면 대입 공격에 약해지고, 높이면 로그인이 느려진다.
      iterations: 210000
      salt-bytes: 16
      # 비밀번호 정책
      min-length: 8
      require-mixed-types: true
    email-verification:
      # 발송 방식 — LOG(로컬: 코드를 로그로 출력) | SMTP(실제 메일 발송)
      sender-mode: LOG
      from-address: no-reply@dwje.co.kr
      code-length: 6
      expire-minutes: 5          # 인증 코드 유효 시간
      max-attempts: 5            # 코드 검증 시도 상한
      resend-wait-sec: 60        # 재발송 대기
      daily-send-limit: 10       # 이메일당 일일 발송 상한
      token-expire-minutes: 10   # 검증 후 발급되는 1회용 토큰 유효 시간
  jwt:
    issuer: dwje-api
    access-token-validity-sec: 3600      # 1시간
    refresh-token-validity-sec: 604800   # 7일

# --- API 문서 -------------------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    # 엔드포인트가 200건을 넘어 기본값(list)으로 두면 태그가 모두 펼쳐져 화면이 무거워진다.
    # none = 태그만 접힌 채 표시 → 필요한 도메인만 펼쳐 본다.
    doc-expansion: none
    # 엔드포인트 검색창. 이 규모에서 원하는 API 를 찾으려면 사실상 필수다.
    filter: true
    # Authorize 로 넣은 토큰을 새로고침 후에도 유지한다(localStorage).
    # 토큰을 매번 다시 붙여넣지 않아도 된다.
    persist-authorization: true
    # 'Try it out' 을 매번 누르지 않아도 되도록 기본 활성화한다.
    try-it-out-enabled: true
    # 응답 소요 시간을 함께 표시한다.
    display-request-duration: true
    # 스키마가 69종이라 하단 Schemas 섹션은 접어 둔다.
    default-models-expand-depth: -1
  api-docs:
    path: /v3/api-docs
  # 공통 응답 래퍼(ApiResponse)가 모든 API 에 동일하게 걸리므로 스키마를 한 번만 정의한다.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
