# =====================================================================================
#  운영(배포) 환경 설정 — 보안 정보는 전부 환경변수로 주입한다.
#
#  키는 최상위마다 한 번만 쓴다. spring: / app: 를 두 번 쓰면 SnakeYAML 이
#  DuplicateKeyException 을 던져 이 프로파일로는 기동 자체가 되지 않는다.
# =====================================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: org.postgresql.Driver
    url: "${PROD_DB_URL:jdbc:postgresql://prod-db.dwje.internal:5432/dwjedb}"
    username: "${PROD_DB_USERNAME:dwje_local}"
    password: "${PROD_DB_PASSWORD}"
    hikari:
      pool-name: dwje-prod-pool
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 10000
      max-lifetime: 1800000
      connection-init-sql: "SET search_path TO ax, mes, vec, common, public"

  # --- 메일 발송 (이메일 인증, R-17) ---
  # 한비로 SMTP — 465 SSL 직접 연결(STARTTLS 아님). 비밀번호는 환경변수 PROD_MAIL_PASSWORD 로만 넣는다(저장소에 적지 않음).
  mail:
    host: "${PROD_MAIL_HOST}"
    port: ${PROD_MAIL_PORT:465}
    username: "${PROD_MAIL_USERNAME}"
    password: "${PROD_MAIL_PASSWORD}"
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: false
      # 연결·읽기·쓰기 제한 각 10초 — SMTP 가 멈춰도 요청 스레드를 오래 붙들지 않는다
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  tomcat:
    threads:
      max: 400

app:
  # 운영 DB 환경(case3) — 기존 api.env 의 DWJE_LLM_BASE_URL 이 있으면 그 값을 우선한다.
  ai:
    base-url: "${DWJE_LLM_BASE_URL:http://192.168.2.8:11436}"
    embed-base-url: "${AX_EMBED_BASE_URL:${DWJE_LLM_BASE_URL:http://192.168.2.8:11436}}"
  llm:
    base-url: "${DWJE_LLM_BASE_URL:http://192.168.2.8:11436}"
  jwt:
    secret: "${PROD_JWT_SECRET}"
  security:
    email-verification:
      # 운영·개발은 실제 메일을 보낸다. LOG 모드는 인증 코드가 로그에 남으므로 쓰면 안 된다.
      sender-mode: SMTP
      # 발신 주소는 인증 계정과 같아야 한다(R-17). 따로 주지 않으면 인증 계정을 쓴다
      from-address: "${PROD_MAIL_FROM:${PROD_MAIL_USERNAME}}"
    account-unlock:
      # SMTP 설정이 끝나 켠다(R-17, D-23 결정) — 잠긴 계정 본인이 이메일 인증으로 풀 수 있다
      email-enabled: true

# 운영에서는 API 문서를 노출하지 않는다.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
